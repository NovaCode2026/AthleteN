[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888

[context.production]
  [[context.production.redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

[context.deploy-preview]
  [[context.deploy-preview.redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

[context.branch-deploy]
  [[context.branch-deploy.redirects]]
    from = "/*"
    to = "/index.html"
    status = 200

[functions]
  node_bundler = "esbuild"
