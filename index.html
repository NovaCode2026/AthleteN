<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="AthleteN — Taekwondo Edition">
  <link rel="icon" type="image/svg+xml" href="/athleten-mark.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/athleten-brand.css">
  <title>AthleteN | Taekwondo Edition</title>
  <link rel="stylesheet" href="/dashboard-lower-fix.css">
</head>
<body>
  <div id="root"></div>

  <script>
    // Supabase can fall back to the configured Site URL after Google OAuth.
    // When that fallback contains a one-time auth code, send it back to the
    // Expo Go instance that started the mobile login before the web Supabase
    // client gets a chance to consume the code.
    (function forwardMobileOAuthCode() {
      var params = new URLSearchParams(window.location.search);
      var hasAuthCode = params.has("code") || params.has("error") || params.has("error_description");
      if (!hasAuthCode || window.location.pathname !== "/") return;

      var mobileCallback = "exp://192.168.1.3:8081/--/auth/callback";
      var callback = new URL(mobileCallback);

      params.forEach(function (value, key) {
        if (key === "code" || key === "state" || key === "error" || key === "error_description") {
          callback.searchParams.set(key, value);
        }
      });

      window.location.replace(callback.toString());
    })();
  </script>

  <script type="module" src="/src/App.tsx"></script>
</body>
</html>
