name: Payment Activation SQL Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/sql/payment-activation-integration.sql"
      - ".github/workflows/payment-activation-sql-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  payment-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athleten_payment_activation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athleten_payment_activation_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply and exercise isolated payment activation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_payment_activation_test -v ON_ERROR_STOP=1 -f tests/sql/payment-activation-integration.sql
