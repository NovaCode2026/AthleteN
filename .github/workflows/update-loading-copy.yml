name: Update AthleteN loading copy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: "${{ !contains(github.event.head_commit.message, 'chore: set loading screen copy') }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set loading screen message
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Loading AthleteN V2...', 'Join the future')
          s = s.replace('Loading secure session...', 'Join the future')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit and clean up
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          rm -f .github/workflows/update-loading-copy.yml
          git add .github/workflows/update-loading-copy.yml
          if git diff --cached --quiet; then
            echo 'Loading copy already updated.'
            exit 0
          fi
          git commit -m 'chore: set loading screen copy'
          git push origin HEAD:main
