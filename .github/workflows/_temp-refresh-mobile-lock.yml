name: Temporary mobile lockfile refresh

on:
  push:
    branches: [main]
    paths:
      - "AthleteN-Mobile/package.json"
      - ".github/workflows/_temp-refresh-mobile-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfile
        run: npm install --package-lock-only
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore(mobile): sync package lock"
          git push

# trigger refresh
