name: AthleteN Android APK Build

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/android-apk-build.yml"
      - ".github/workflows/mobile-check.yml"

permissions:
  contents: read

concurrency:
  group: athleten-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable debug APK
        run: cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AthleteN-debug-apk
          path: AthleteN-Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
