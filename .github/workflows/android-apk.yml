name: AthleteN Android APK

on:
  push:
    branches: [main]
    paths:
      - 'AthleteN-Mobile/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install server test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Run scanner regression tests
        run: node --test tests/athleten-mobile-scanner-regression.test.mjs

  build-apk:
    needs: scanner-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AthleteN-Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build standalone release APK
        working-directory: AthleteN-Mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AthleteN-release-apk
          path: AthleteN-Mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
