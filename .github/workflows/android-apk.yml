name: AthleteN Android CI APK (debug-signed)

on:
  push:
    branches: [main, qa/fix-nov-20-findings, feat/rewarded-ads-rewards-centre-20261124]
    paths:
      - 'AthleteN-Mobile/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install server test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check scanner JavaScript syntax
        run: node --check netlify/functions/tournament-scan.mjs && node --check netlify/functions/instagram-tournament-scan.mjs
      - name: Run scanner regression tests
        run: node --test tests/athleten-mobile-scanner-regression.test.mjs

  build-apk:
    needs: scanner-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AthleteN-Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npx tsc --noEmit --pretty false

      - name: ESLint validation
        run: npm run lint

      - name: Normalize mislabeled WebP assets before Expo prebuild
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          find assets -type f -iname '*.png' -print0 | while IFS= read -r -d '' asset; do
            mime="$(file --brief --mime-type "$asset")"
            if [ "$mime" = "image/webp" ]; then
              echo "Converting WebP content mislabeled as PNG: $asset"
              temp_file="${asset}.normalized.png"
              magick "$asset" "png:$temp_file"
              mv "$temp_file" "$asset"
            fi
          done

      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Build standalone release APK
        working-directory: AthleteN-Mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: AthleteN-ci-debug-signed-apk
          path: AthleteN-Mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
