name: AthleteN Android CI APK (debug-signed QA)

on:
  push:
    branches: [main]
    paths:
      - 'AthleteN-Mobile/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main, fix/age-verification-release-hardening-20261112]
    paths:
      - 'AthleteN-Mobile/**'
      - 'netlify/functions/**'
      - 'tests/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scanner-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install server test dependencies
        run: npm install --no-package-lock --ignore-scripts
      - name: Check scanner JavaScript syntax
        run: node --check netlify/functions/tournament-scan.mjs && node --check netlify/functions/instagram-tournament-scan.mjs
      - name: Run scanner regression tests
        run: node --test tests/athleten-mobile-scanner-regression.test.mjs

  build-apk:
    needs: scanner-regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: AthleteN-Mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --non-interactive

      - name: Build standalone QA APK (release variant, debug key)
        env:
          EXPO_PUBLIC_APP_CHANNEL: qa
        working-directory: AthleteN-Mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify QA APK signature and debug certificate
        working-directory: AthleteN-Mobile/android
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNATURE_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNATURE_OUTPUT"
          printf '%s\n' "$SIGNATURE_OUTPUT" | grep -F "CN=Android Debug"

      - name: Upload QA APK
        uses: actions/upload-artifact@v7
        with:
          name: AthleteN-qa-debug-signed-apk
          path: AthleteN-Mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
