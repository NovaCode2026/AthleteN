name: Remove legacy edition markers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove legacy markers
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          skip = {'.git', 'node_modules', 'dist', 'build', '.next'}
          changed = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace('V2', '')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              print('No legacy markers found.')
          else:
              print('Updated:', *changed, sep='\n- ')

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "chore: remove legacy edition markers"
          git push
