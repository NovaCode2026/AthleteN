name: AthleteN Publish OTA Update

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Target EAS Update channel
        required: true
        type: choice
        options:
          - preview
          - production
        default: preview
      message:
        description: Release summary shown in EAS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: athleten-ota-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ inputs.channel == 'production' && 'athleten-production-ota' || 'athleten-preview-ota' }}
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - name: Enforce channel and branch safety
        working-directory: .
        env:
          OTA_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "${OTA_CHANNEL}" = "production" ]; then
            if [ "${GITHUB_REF_NAME}" != "main" ]; then
              echo "::error::Production OTA updates may only be published from main."
              exit 1
            fi
          elif [ "${OTA_CHANNEL}" = "preview" ]; then
            case "${GITHUB_REF_NAME}" in
              main|feat/rewarded-ads-rewards-centre-20261124) ;;
              *) echo "::error::Preview OTA updates must run from main or the reviewed PR #76 branch."; exit 1 ;;
            esac
          else
            echo "::error::Unsupported OTA channel."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Validate tests, types, lint and Expo config
        run: |
          npm test
          npx tsc --noEmit --pretty false
          npm run lint
          npx --yes expo-doctor@1.20.5
          npx expo config --type public --json > /tmp/athleten-expo-config.json
          node -e "const c=require('/tmp/athleten-expo-config.json'); if(c.runtimeVersion?.policy!=='fingerprint'||c.updates?.enabled!==true||!c.updates?.url) process.exit(1);"

      - name: Publish compatible Android OTA update
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          OTA_CHANNEL: ${{ inputs.channel }}
          OTA_MESSAGE: ${{ inputs.message }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Configure EXPO_TOKEN as a repository or environment secret."
            exit 1
          fi
          npx --yes eas-cli@latest update \
            --channel "${OTA_CHANNEL}" \
            --platform android \
            --message "${OTA_MESSAGE}" \
            --non-interactive
