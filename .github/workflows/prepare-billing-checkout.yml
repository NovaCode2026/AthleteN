name: Prepare billing checkout path

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add future checkout routing
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('src/App.tsx')
          text = app.read_text()
          marker = '/* ATHLETEOS_FUTURE_BILLING_CHECKOUT_V1 */'
          if marker in text:
              raise SystemExit(0)

          old = 'type PageId = "dashboard" | "profile" | "plans" | "verification" | "tournaments" | "training" | "medals" | "documents" | "weight" | "calendar" | "checklist" | "scanner" | "ai" | "feedback" | "roadmap" | "messages" | "admin";'
          new = old.replace(' | "admin";', ' | "admin" | "checkout";')
          if old not in text:
              raise SystemExit('PageId declaration not found; refusing unsafe rewrite')
          text = text.replace(old, new, 1)

          old = '  if (path === "/admin") return "admin";\n  if (path === "/messages") return "messages";'
          new = '  if (path === "/admin") return "admin";\n  if (path.startsWith("/checkout/")) return "checkout";\n  if (path === "/messages") return "messages";'
          if old not in text:
              raise SystemExit('pageFromPath anchor not found; refusing unsafe rewrite')
          text = text.replace(old, new, 1)

          old = '''          <button className={`btn ${isCurrent ? "" : "primary"}`} disabled>\n            {isCurrent ? "Current plan" : "Upgrade coming soon"}\n          </button>'''
          new = '''          <button\n            className={`btn ${isCurrent ? "" : "primary"}`}\n            disabled={isCurrent}\n            onClick={() => {\n              if (isCurrent) return;\n              window.history.pushState(null, "", `/checkout/${plan.id}`);\n              window.dispatchEvent(new PopStateEvent("popstate"));\n            }}\n          >\n            {isCurrent ? "Current plan" : "Continue to checkout"}\n          </button>'''
          if old not in text:
              raise SystemExit('Plans button block not found; refusing unsafe rewrite')
          text = text.replace(old, new, 1)

          anchor = '\nfunction VerificationPage({ rows, openForm }:'
          checkout = '''\n\n/* ATHLETEOS_FUTURE_BILLING_CHECKOUT_V1 */\nfunction CheckoutPage() {\n  const planId = window.location.pathname.split("/").filter(Boolean)[1] || "free";\n  const plan = getPlan(planId);\n\n  if (!plan || plan.id === "free") {\n    return <FeaturePage title="Checkout">\n      <section className="card panel">\n        <p className="eyebrow">Billing route</p>\n        <h3>Free plan</h3>\n        <p>No payment is required for the Free plan. Return to Plans to choose a paid plan.</p>\n        <button className="btn primary" onClick={() => { window.history.pushState(null, "", "/"); window.dispatchEvent(new PopStateEvent("popstate")); }}>Back to plans</button>\n      </section>\n    </FeaturePage>;\n  }\n\n  return <FeaturePage title="Checkout">\n    <section className="card panel checkout-shell">\n      <div className="checkout-summary">\n        <p className="eyebrow">AthleteOS billing</p>\n        <h3>Continue with {plan.name}</h3>\n        <div className="checkout-price">{plan.price}</div>\n        <p>{plan.aiLimit.toLocaleString()} AI coach messages/month</p>\n        <ul>{plan.features.map((feature) => <li key={feature}>{feature}</li>)}</ul>\n      </div>\n      <div className="checkout-provider-slot">\n        <span className="pill">Payment provider slot</span>\n        <h4>Ready for payment integration</h4>\n        <p>This route is intentionally payment-provider neutral. Later, connect the checkout action here and return the provider's success/cancel result to the dedicated callback routes.</p>\n        <div className="checkout-route-list">\n          <code>/checkout/{plan.id}</code>\n          <code>/checkout/success</code>\n          <code>/checkout/cancel</code>\n        </div>\n        <button className="btn" onClick={() => { window.history.pushState(null, "", "/"); window.dispatchEvent(new PopStateEvent("popstate")); }}>Back to plans</button>\n      </div>\n    </section>\n  </FeaturePage>;\n}\n'''
          if anchor not in text:
              raise SystemExit('Checkout insertion anchor not found; refusing unsafe rewrite')
          text = text.replace(anchor, checkout + anchor, 1)

          old = '  else if (page === "plans") content = <PlansPage profile={data.profile} subscriptions={data.subscriptions} />;\n  else if (page === "verification")'
          new = '  else if (page === "plans") content = <PlansPage profile={data.profile} subscriptions={data.subscriptions} />;\n  else if (page === "checkout") content = <CheckoutPage />;\n  else if (page === "verification")'
          if old not in text:
              raise SystemExit('Plans render anchor not found; refusing unsafe rewrite')
          text = text.replace(old, new, 1)

          app.write_text(text)

          css = Path('src/styles/main.css')
          styles = css.read_text()
          css_marker = '/* ATHLETEOS_FUTURE_CHECKOUT_STYLES_V1 */'
          if css_marker not in styles:
              styles += '''\n\n/* ATHLETEOS_FUTURE_CHECKOUT_STYLES_V1 */\n.checkout-shell { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 0.8fr); gap: 24px; align-items: stretch; }\n.checkout-summary, .checkout-provider-slot { padding: 8px; }\n.checkout-price { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; margin: 12px 0 4px; }\n.checkout-provider-slot { border: 1px dashed var(--border, #31506f); border-radius: 18px; padding: 22px; }\n.checkout-provider-slot h4 { margin: 14px 0 8px; }\n.checkout-route-list { display: grid; gap: 8px; margin: 18px 0; }\n.checkout-route-list code { display: block; padding: 9px 11px; border-radius: 10px; background: rgba(255,255,255,.04); overflow-wrap: anywhere; }\n@media (max-width: 800px) { .checkout-shell { grid-template-columns: 1fr; } }\n'''
              css.write_text(styles)
      - name: Verify build
        run: npm ci && npm run build
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/styles/main.css
          git commit -m "feat: add future billing checkout route"
          git push
          git rm .github/workflows/prepare-billing-checkout.yml
          git commit -m "chore: remove one-time billing route patch workflow"
          git push