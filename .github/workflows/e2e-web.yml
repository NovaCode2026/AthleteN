name: AthleteN Web E2E

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.3
      - name: Install project dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright without changing project manifests
        run: npm install --no-save --package-lock=false @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run web browser journeys
        run: npx playwright test
        env:
          CI: "true"
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV4YW1wbGUiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTcwMDAwMDAwMCwiZXhwIjoyMDAwMDAwMDAwfQ.test-only-placeholder
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athleten-web-e2e-${{ github.run_number }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
