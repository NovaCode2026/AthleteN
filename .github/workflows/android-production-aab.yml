name: AthleteN Android Production AAB

on:
  workflow_dispatch:
    inputs:
      build_message:
        description: Build label shown in Expo
        required: false
        default: Manual signed production AAB build
        type: string

permissions:
  contents: read

jobs:
  production-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build signed Android App Bundle with EAS
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          BUILD_MESSAGE: ${{ inputs.build_message }}
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::Add the Expo access token as the repository Actions secret EXPO_TOKEN."
            exit 1
          fi

          npx --yes eas-cli@latest build \
            --platform android \
            --profile production \
            --non-interactive \
            --message "${BUILD_MESSAGE:-Manual signed production AAB build}"
