name: AthleteN Production-Signed Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-production-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: AthleteN-Mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Verify EAS authentication secret
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Configure the EXPO_TOKEN GitHub Actions secret before requesting a production APK."
            exit 1
          fi
      - name: Build production-signed APK with persistent EAS credentials
        run: npx --yes eas-cli@latest build --platform android --profile production-apk --non-interactive --wait
