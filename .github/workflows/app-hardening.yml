name: app-hardening

on:
  push:
    branches: [main]
    paths:
      - "scripts/role-dashboard-hardening.mjs"
      - "src/App.tsx"
      - "package.json"
      - "src/components/roles/RoleDashboards.tsx"

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply hardening
        run: node scripts/role-dashboard-hardening.mjs
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx package.json
          if git diff --cached --quiet; then
            echo "No generated changes needed."
            exit 0
          fi
          git commit -m "Fix role dashboards and local function development"
          git push origin HEAD:main
