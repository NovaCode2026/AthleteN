name: Repair mobile lockfile
on:
  workflow_dispatch:
  push:
    branches:
      - feat/reliable-simple-custom-navigation
    paths:
      - 'AthleteN-Mobile/package.json'
      - '.github/workflows/repair-mobile-lock.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate npm lockfile with npm
        working-directory: AthleteN-Mobile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit canonical lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AthleteN-Mobile/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already synchronized"
          else
            git commit -m "chore(mobile): regenerate canonical npm lockfile"
            git push
          fi
