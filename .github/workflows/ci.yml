name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Migrate legacy AthleteN branding
        if: ${{ !contains(github.event.head_commit.message, 'chore: rename product branding to AthleteN') }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'AthleteOS': 'AthleteN',
              'Athlete OS': 'AthleteN',
              'athlete-os': 'athlete-n',
              'athlete_os': 'athlete_n',
              'athleteos': 'athleten',
          }
          skip_dirs = {'.git', 'node_modules', 'dist', 'build', '.next', '.netlify'}
          binary_exts = {'.png','.jpg','.jpeg','.gif','.webp','.ico','.pdf','.zip','.woff','.woff2','.ttf','.otf','.mp4','.mov','.mp3','.wav'}
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or p.suffix.lower() in binary_exts or any(x in skip_dirs for x in p.parts) or p.name == 'LICENSE':
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              t = s
              for old, new in replacements.items():
                  t = t.replace(old, new)
              if t != s:
                  p.write_text(t, encoding='utf-8')
                  changed.append(str(p))
          print('Branding files changed:', *changed, sep='\n')
          PY
          if git diff --quiet; then
            echo 'No legacy branding changes required.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            git commit -m 'chore: rename product branding to AthleteN'
            git push origin HEAD:main
          fi
      - name: Verify no legacy branding
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=build --exclude-dir=.next --exclude-dir=.netlify --exclude=LICENSE 'AthleteOS|Athlete OS|athlete-os|athlete_os|athleteos' .; then
            echo 'Legacy branding remains.'
            exit 1
          fi
      - name: Restore damaged App shell
        if: github.sha == '4b6fc6b159030e55428be029528e0427e54707b4'
        shell: bash
        run: |
          git checkout a93293ab2a4fea89a2a35e5966ee0c5d9c497ebb -- src/App.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''    verifications: [["document_type", "Proof type", "select", ["school_id", "fee_receipt", "bonafide"]], ["file_path", "Storage file path"], ["status", "Status", "select", ["pending", "approved", "rejected"]]]'''
          new = '''    verifications: [["document_type", "Proof type", "select", ["school_id", "fee_receipt", "bonafide"]]]'''
          if old not in s: raise SystemExit('verification fields pattern not found')
          s = s.replace(old, new, 1)
          old_submit = '''      if (form.resource === "documents" && file) {
        if (!userId) throw new Error("Please sign in again before uploading.");
        const extension = file.name.includes(".") ? file.name.split(".").pop() : "bin";
        const safeName = `${crypto.randomUUID()}.${extension}`;
        payload.file_path = await uploadPrivateFile("documents", `${userId}/${safeName}`, file);
      }
      await save(form.resource, payload);'''
          new_submit = '''      if ((form.resource === "documents" || form.resource === "verifications") && file) {
        if (!userId) throw new Error("Please sign in again before uploading.");
        const extension = file.name.includes(".") ? file.name.split(".").pop() : "bin";
        const safeName = `${crypto.randomUUID()}.${extension}`;
        const bucket = form.resource === "verifications" ? "verification-proofs" : "documents";
        payload.file_path = await uploadPrivateFile(bucket, `${userId}/${safeName}`, file);
      }
      if (form.resource === "verifications") {
        payload.status = "pending";
      }
      await save(form.resource, payload);'''
          if old_submit not in s: raise SystemExit('upload submit pattern not found')
          s = s.replace(old_submit, new_submit, 1)
          old_render = '''{form.resource === "documents" && <label className="field"><span>Upload file</span><input type="file" onChange={(event) => setFile(event.target.files?.[0] || null)} /></label>}'''
          new_render = '''{(form.resource === "documents" || form.resource === "verifications") && <label className="field"><span>{form.resource === "verifications" ? "Proof file" : "Upload file"}</span><input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp" required onChange={(event) => setFile(event.target.files?.[0] || null)} /></label>}'''
          if old_render not in s: raise SystemExit('file picker pattern not found')
          s = s.replace(old_render, new_render, 1)
          p.write_text(s, encoding='utf-8')
          git config user.name 'Nova Code'
          git config user.email 'novacode.create@gmail.com'
          git add src/App.tsx
          git commit -m 'fix: restore app and verification proof upload'
          git push origin HEAD:main
      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@10.30.3 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: npm test
      - name: Production build
        run: npm run build
