name: AthleteN Mobile Check

on:
  push:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - "src/**"
      - "supabase/**"
      - "netlify/functions/**"
      - ".github/workflows/mobile-check.yml"

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply non-breaking npm security updates
        run: npm audit fix --package-lock-only || true

      - name: Install audited dependency tree
        run: npm ci

      - name: Expo doctor
        id: expo_doctor
        run: npx expo-doctor
        continue-on-error: true

      - name: Dependency audit report
        run: npm audit || true

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Android bundle check
        run: npx expo export --platform android --output-dir .expo/ci-export

      - name: Remove CI export
        if: always()
        run: rm -rf .expo/ci-export

      - name: Capture updated mobile dependency lock and audit report
        if: always()
        run: npm audit --json > mobile-npm-audit.json || true

      - name: Upload mobile dependency audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-dependency-audit
          path: |
            AthleteN-Mobile/package-lock.json
            AthleteN-Mobile/mobile-npm-audit.json
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce Expo compatibility result
        if: always()
        run: |
          if [ "${{ steps.expo_doctor.outcome }}" != "success" ]; then
            echo "::error::Expo Doctor failed. Resolve or document the SDK package mismatch before release."
            exit 1
          fi
