name: AthleteN Mobile Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-check.yml"

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-health:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Install dependencies (repair stale lockfile in CI workspace)
        run: npm install

      - name: Mobile contract tests
        run: npm test

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Install ImageMagick for Expo config asset validation
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Normalize WebP assets for Expo validation (CI workspace only)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("AthleteN-Mobile")
          converted = []
          for asset in root.rglob("*"):
              if not asset.is_file() or asset.suffix.lower() not in {".webp", ".png", ".jpg", ".jpeg"}:
                  continue
              result = subprocess.run(["file", "--brief", "--mime-type", str(asset)], capture_output=True, text=True)
              if result.stdout.strip() != "image/webp":
                  continue
              target = asset.with_suffix(".png")
              subprocess.run(["magick", str(asset), f"png:{target}"], check=True)
              converted.append((asset.relative_to(root).as_posix(), target.relative_to(root).as_posix()))
              if asset != target:
                  asset.unlink()
          for old, new in converted:
              for file in root.rglob("*"):
                  if not file.is_file() or file.suffix.lower() not in {".json", ".js", ".jsx", ".ts", ".tsx", ".mjs", ".cjs", ".xml", ".md"}:
                      continue
                  try:
                      text = file.read_text()
                  except (UnicodeDecodeError, OSError):
                      continue
                  updated = text.replace(old, new)
                  if updated != text:
                      file.write_text(updated)
              print(f"Converted {old} -> {new}")
          PY

      - name: Android bundle check
        run: npx expo export --platform android --output-dir .expo/ci-export

      - name: Expo doctor
        # Pin the Expo SDK 57-compatible doctor release. The unpinned npx
        # command fetched a newer build whose runtime import failed in CI.
        run: npx --yes expo-doctor@1.20.5

      - name: Remove CI export
        if: always()
        run: rm -rf .expo/ci-export
