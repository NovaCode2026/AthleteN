name: AthleteN Mobile Check

on:
  push:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-check.yml"

permissions:
  contents: read

concurrency:
  group: mobile-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
