name: Mobile Validation

on:
  push:
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-validation.yml"
  pull_request:
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-validation.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Expo Doctor
        run: npx expo-doctor
