name: Security SQL Draft Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/security/**"
      - "supabase/migrations/20261124235000_academy_management_suite.sql"
      - "tests/sql/**"
      - "tests/academy-management-suite.test.mjs"
      - "docs/MIGRATION_HISTORY_DRIFT_2026-11-13.md"
      - "docs/PRODUCTION_READINESS_GATE_2026-11-12.md"
      - ".github/workflows/security-sql-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-security-drafts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: athleten_security_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d athleten_security_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Create isolated security fixture
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_security_test -v ON_ERROR_STOP=1 -f tests/sql/security-fixture.sql
      - name: Apply age-verification review draft
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_security_test -v ON_ERROR_STOP=1 -f supabase/security/age_verification_hardening.sql
      - name: Apply role and finance review draft
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_security_test -v ON_ERROR_STOP=1 -f supabase/security/role_and_finance_authorization_hardening.sql
      - name: Apply connected-team age-gating review draft
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_security_test -v ON_ERROR_STOP=1 -f supabase/security/age_gated_coach_access_hardening.sql
      - name: Apply November 30 candidate security migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_security_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261118000400_harden_team_finance_and_checkout_eligibility.sql
      - name: Run DOB, guardian, Coach and Academy authorization assertions
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_security_test -v ON_ERROR_STOP=1 -f tests/sql/security-authorization-integration.sql
      - name: Create isolated messaging reactions database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres athleten_message_reactions_test
      - name: Create messaging fixture and apply reaction migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d athleten_message_reactions_test -v ON_ERROR_STOP=1 -f tests/sql/message-reactions-integration.sql
          psql -h 127.0.0.1 -U postgres -d athleten_message_reactions_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124140000_message_reactions.sql
      - name: Verify reaction conversation membership, ownership and allowed values
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_message_reactions_test -v ON_ERROR_STOP=1 -f tests/sql/message-reactions-assertions.sql
      - name: Create isolated athlete Quest and Away Mode database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres athleten_quest_away_test
      - name: Apply Quest and Away Mode migration and verify owner isolation
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_quest_away_test -v ON_ERROR_STOP=1 -f tests/sql/athlete-quest-away-mode-integration.sql
      - name: Create isolated Coach and Academy management database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres athleten_academy_management_test
      - name: Create Coach and Academy fixture and apply hardening migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d athleten_academy_management_test -v ON_ERROR_STOP=1 -f tests/sql/academy-management-fixture.sql
          psql -h 127.0.0.1 -U postgres -d athleten_academy_management_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124233000_harden_academy_workspace_management.sql
      - name: Verify Coach consent, Academy Admin role and membership permissions
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_academy_management_test -v ON_ERROR_STOP=1 -f tests/sql/academy-management-assertions.sql

      - name: Create isolated Academy Management Suite database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres athleten_academy_suite_test
      - name: Create Academy Management Suite base fixture and apply workspace hardening
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -U postgres -d athleten_academy_suite_test -v ON_ERROR_STOP=1 -f tests/sql/academy-management-fixture.sql
          psql -h 127.0.0.1 -U postgres -d athleten_academy_suite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124233000_harden_academy_workspace_management.sql
          psql -h 127.0.0.1 -U postgres -d athleten_academy_suite_test -v ON_ERROR_STOP=1 -f tests/sql/academy-management-suite-fixture.sql
      - name: Apply Academy Management Suite candidate migration
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_academy_suite_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261124235000_academy_management_suite.sql
      - name: Verify Academy fees, Coach ops, transfer consent, guardian scope, seats and audit
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -d athleten_academy_suite_test -v ON_ERROR_STOP=1 -f tests/sql/academy-management-suite-assertions.sql
