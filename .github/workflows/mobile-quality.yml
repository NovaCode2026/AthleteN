name: Mobile Quality Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-quality.yml"
  push:
    branches: [main]
    paths:
      - "AthleteN-Mobile/**"
      - ".github/workflows/mobile-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    name: Android app checks and bundle export
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: AthleteN-Mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: AthleteN-Mobile/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Mobile configuration regression tests
        run: npm test

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Export Android JavaScript bundle
        run: npx expo export --platform android --output-dir .expo-export

      - name: Upload Android export
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: athleten-android-js-export
          path: AthleteN-Mobile/.expo-export/
          if-no-files-found: error
          retention-days: 7
